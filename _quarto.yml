project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/build_catalog.py
  post-render: python3 scripts/build_catalog.py --index
  resources:
    - data/resources.csv
    - guide-files
  render:
    - "*.qmd"
website:
  title: "NeedsAssessment.org"
  site-url: "https://ryanrwatkins.github.io/needsassessment/"
  repo-url: "https://github.com/ryanrwatkins/needsassessment"
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: overview.qmd
        text: "Overview"
      - href: foundations.qmd
        text: "Foundations"
      - href: resources.qmd
        text: "Resources"
      - href: guide.qmd
        text: "Guide"
      - href: faq.qmd
        text: "FAQ"
format:
  html:
    theme: cosmo
    css: assets/site.css
    toc: true
    link-external-newwindow: true
